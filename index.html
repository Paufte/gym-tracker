/* Layout: product-page rhythm. Each top-level screen opens with an editorial hero (kicker, display title ending in the accent full stop, lede), then hairline-ruled sections with big tabular numbers. Surfaces only where they group real controls (sets, charts). Accent: one electric blue. */
:root {
  --bg: #f5f5f7;

  --chalk: var(--accent);

  --bar: rgba(245, 245, 247, .86);

  --f-display: "Inter Tight", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;

}

    --bg: #000000; --surface: #121214; --surface-2: #161618; --fill: rgba(255, 255, 255, .07); --fill-2: rgba(255, 255, 255, .12);
    --line: #2c2c2e; --hair: rgba(255, 255, 255, .1); --fg: #f5f5f7; --muted: #8e8e93; --faint: #5c5c61;
    --accent: #5b78ff; --accent-soft: rgba(91, 120, 255, .16); --bar: rgba(0, 0, 0, .8);

    color-scheme: dark;

}
:root[data-theme="dark"] {

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 24px; border-radius: 999px; border: 0; background: var(--fill); color: var(--fg); font-size: 16px; font-weight: 600; letter-spacing: -.01em; transition: transform .2s var(--ease), background .2s, opacity .2s; }

<script>
'use strict';
/* ============================================================
   Personal Gym Tracker
   Data lives in the artifact database (collections: exercises,
   routines, sessions, config). localStorage keeps an offline
   mirror and the list of unsynced writes; it is the store only
   when the database is not available in this view.
   ============================================================ */
const COLLS = ['exercises', 'routines', 'sessions', 'config'];
const LS = { mirror: 'pgt.mirror.v1', pending: 'pgt.pending.v1', local: 'pgt.localdb.v1', ui: 'pgt.ui.v1' };
const PLATES = [['red', 'Vermell'], ['blue', 'Blau'], ['yellow', 'Groc'], ['green', 'Verd'], ['white', 'Blanc']];
const FEELS = [['easy', 'Fàcil'], ['normal', 'Normal'], ['hard', 'Difícil'], ['tech', 'Tècnica compromesa']];
const FEEL_LABEL = Object.fromEntries(FEELS);

const S = { exercises: {}, routines: {}, sessions: {}, config: {}, mode: 'loading', ready: false, cloudConfirmed: false, rev: 0 };
let backend = null, downloads = null;
let view = { name: 'home', p: {} };
const viewStack = [];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const now = () => Date.now();
const uid = p => p + '-' + now().toString(36) + Math.random().toString(36).slice(2, 7);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const num = v => { if (v === null || v === undefined || v === '') return null; const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
const fmtN = (n, d = 1) => n == null ? '—' : (Math.round(n * 10 ** d) / 10 ** d).toLocaleString('ca-ES', { maximumFractionDigits: d });
const fmtKg = n => n == null ? '—' : fmtN(n, 2);
const fmtVol = n => Math.round(n || 0).toLocaleString('ca-ES');
const dFmt = (t, o) => new Date(t).toLocaleDateString('ca-ES', o);
const dShort = t => dFmt(t, { day: 'numeric', month: 'short' });
const dLong = t => dFmt(t, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const tFmt = t => new Date(t).toLocaleTimeString('ca-ES', { hour: '2-digit', minute: '2-digit' });
const dur = ms => { if (!ms || ms < 0) return '—'; const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0'); };
const ago = t => { const d = Math.floor((startOfDay(now()) - startOfDay(t)) / 864e5); return d <= 0 ? 'avui' : d === 1 ? 'ahir' : 'fa ' + d + ' dies'; };
function startOfDay(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
const settings = () => Object.assign({ restDefault: 90, increment: 2.5 }, S.config.settings || {});

const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5L7.5 12l7.5 7.5"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="9" width="3" height="6" rx="1"/><rect x="18.5" y="9" width="3" height="6" rx="1"/><rect x="5.5" y="6.5" width="3" height="11" rx="1"/><rect x="15.5" y="6.5" width="3" height="11" rx="1"/><path d="M8.5 12h7"/></svg>',
  hist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l6-6 4 3 8-9"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
};

/* ---------- persistence ---------- */
const Local = {
  read() { return lsGet(LS.local, {}); },
  async set(c, id, data) { const d = this.read(); (d[c] ||= {})[id] = data; if (!lsSet(LS.local, d)) throw { code: 'quota_exceeded', message: 'L’emmagatzematge del navegador és ple' }; },
  async del(c, id) { const d = this.read(); if (d[c]) delete d[c][id]; lsSet(LS.local, d); },
  load() { const d = this.read(); for (const c of COLLS) S[c] = d[c] || {}; },
};
const Cloud = {
  db: null,
  set(c, id, data) { return this.db.collection(c).doc(id).set(data); },
  del(c, id) { return this.db.collection(c).doc(id).delete(); },
  subscribe() {
    const loaded = {};
    const sub = c => {
      this.db.collection(c).onSnapshot(snap => {
        applyRemote(c, snap);
        loaded[c] = true;
        if (!snap.metadata.fromCache) { S.confirmed = S.confirmed || {}; S.confirmed[c] = true; }
        if (COLLS.every(k => loaded[k])) S.ready = true;
        if (COLLS.every(k => S.confirmed && S.confirmed[k])) { S.cloudConfirmed = true; S.offlineNote = false; }
        dataChanged();
      }, err => {
        S.offlineNote = true; dataChanged();
        if (!err || err.code === 'unavailable') setTimeout(() => sub(c), 5000 + Math.random() * 3000);
      });
    };
    COLLS.forEach(sub);
  },
};
function applyRemote(c, snap) {
  const seen = new Set();
  for (const d of snap.docs) {
    seen.add(d.id);
    const key = c + '/' + d.id;
    if (pending.has(key)) continue;
    const inc = clone(d.data());
    const loc = S[c][d.id];
    if (loc && (loc.updatedAt || 0) > (inc.updatedAt || 0)) continue;
    S[c][d.id] = inc;
  }
  if (!snap.metadata.fromCache) {
    for (const id of Object.keys(S[c])) if (!seen.has(id) && !pending.has(c + '/' + id)) delete S[c][id];
  }
}

const pending = new Map();
function savePendingList() { lsSet(LS.pending, Array.from(pending.keys())); }
function persist(c, id, delay = 450) {
  const key = c + '/' + id;
  let p = pending.get(key);
  if (!p) { p = { fails: 0 }; pending.set(key, p); savePendingList(); }
  clearTimeout(p.timer);
  p.timer = setTimeout(() => flush(c, id), delay);
  scheduleMirror(); updateSync();
}
function put(c, id, data, delay) { data.updatedAt = now(); S[c][id] = data; persist(c, id, delay); }
function remove(c, id) { delete S[c][id]; persist(c, id, 0); }
async function flush(c, id) {
  const key = c + '/' + id, p = pending.get(key);
  if (!p) return;
  p.timer = null;
  if (!backend) { p.timer = setTimeout(() => flush(c, id), 1000); return; }
  if (p.inflight) { p.dirty = true; return; }
  p.inflight = true; p.dirty = false;
  const data = S[c][id] ? clone(S[c][id]) : null;
  try {
    if (data) await backend.set(c, id, data); else await backend.del(c, id);
    p.fails = 0; S.lastSaved = now(); S.lastError = null;
  } catch (e) {
    p.inflight = false; p.fails++; S.lastError = e || { code: 'unavailable' };
    const code = e && e.code;
    if (code === 'invalid_argument' || code === 'quota_exceeded' || code === 'transform_error') {
      toast('No s’ha pogut desar: ' + (e.message || code) + '. Les dades es mantenen en aquest dispositiu.');
    } else {
      p.timer = setTimeout(() => flush(c, id), Math.min(30000, 1500 * 2 ** p.fails) + Math.random() * 500);
    }
    updateSync(); return;
  }
  p.inflight = false;
  if (p.dirty) return flush(c, id);
  if (p.timer) return;
  pending.delete(key); savePendingList(); scheduleMirror(); updateSync();
}
let mirrorT = null;
function scheduleMirror() { clearTimeout(mirrorT); mirrorT = setTimeout(writeMirror, 700); }
function writeMirror() {
  if (S.mode !== 'cloud') return;
  const sess = Object.values(S.sessions).sort((a, b) => b.startedAt - a.startedAt);
  const keep = {};
  sess.slice(0, 60).forEach(s => keep[s.id] = s);
  sess.forEach(s => { if (pending.has('sessions/' + s.id) || s.status === 'active') keep[s.id] = s; });
  const m = { exercises: S.exercises, routines: S.routines, config: S.config, sessions: keep, savedAt: now(), uid: Supa.uid || null };
  if (!lsSet(LS.mirror, m)) { m.sessions = Object.fromEntries(Object.entries(keep).filter(([k, s]) => s.status === 'active' || pending.has('sessions/' + k))); lsSet(LS.mirror, m); }
}
function updateSync() {
  const el = $('#sync'); if (!el) return;
  const [s, t] = syncState(); el.dataset.s = s; el.querySelector('b').textContent = t;
}
function syncState() {
  if (S.mode === 'local') return ['local', 'Només aquest navegador'];
  if (S.mode === 'loading') return ['saving', 'Connectant…'];
  if (S.mode === 'auth') return ['local', 'Sense sessió'];
  const n = pending.size;
  if (n && S.lastError) return ['error', n + ' canvis sense desar'];
  if (n) return ['saving', 'Desant…'];
  if (S.offlineNote && !S.cloudConfirmed) return ['offline', 'Sense connexió'];
  return ['ok', 'Desat al núvol'];
}

/* Supabase backend (used by the standalone PWA build, which defines window.PGT_SUPA) */
const Supa = {
  client: null, uid: null, chan: null, fetching: null, again: false,
  err(e) { const m = (e && e.message) || String(e); return { code: /fetch|network|timeout|Load failed/i.test(m) ? 'unavailable' : (e && e.code === '42501' ? 'invalid_argument' : 'unavailable'), message: m }; },
  async set(c, id, data) { const { error } = await this.client.from('docs').upsert({ user_id: this.uid, coll: c, id, data, updated_at: new Date().toISOString() }); if (error) throw this.err(error); },
  async del(c, id) { const { error } = await this.client.from('docs').delete().match({ user_id: this.uid, coll: c, id }); if (error) throw this.err(error); },
  async fetchAll() {
    if (this.fetching) { this.again = true; return this.fetching; }
    this.fetching = (async () => {
      const rows = [];
      for (let from = 0; ; from += 1000) {
        const { data, error } = await this.client.from('docs').select('coll,id,data').eq('user_id', this.uid).range(from, from + 999);
        if (error) throw this.err(error);
        rows.push(...data); if (data.length < 1000) break;
      }
      const by = {}; rows.forEach(r => (by[r.coll] ||= []).push(r));
      for (const c of COLLS) applyRemote(c, { docs: (by[c] || []).map(r => ({ id: r.id, data: () => r.data })), metadata: { fromCache: false } });
      S.ready = true; S.cloudConfirmed = true; S.offlineNote = false; dataChanged();
    })();
    try { await this.fetching; } catch (e) { S.offlineNote = true; S.ready = true; dataChanged(); }
    finally { this.fetching = null; if (this.again) { this.again = false; setTimeout(() => this.fetchAll(), 300); } }
  },
  subscribe() {
    this.fetchAll();
    let t; const soon = () => { clearTimeout(t); t = setTimeout(() => this.fetchAll(), 700); };
    try { this.chan = this.client.channel('docs-' + this.uid).on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'user_id=eq.' + this.uid }, soon).subscribe(); } catch {}
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.fetchAll(); });
    window.addEventListener('online', () => { this.fetchAll(); for (const key of pending.keys()) { const [c, id] = key.split('/'); persist(c, id, 50); } });
    setInterval(() => { if (document.visibilityState === 'visible') this.fetchAll(); }, 60000);
  },
};
async function bootSupa() {
  const cfg = window.PGT_SUPA;
  try { Supa.client = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } }); }
  catch (e) { S.ready = true; S.mode = 'local'; backend = Local; Local.load(); render(); toast('No s’ha pogut iniciar la connexió amb Supabase.'); return; }
  let session = null;
  try { session = (await Supa.client.auth.getSession()).data.session; } catch {}
  if (!session) { S.mode = 'auth'; S.ready = true; view = { name: 'login', p: {} }; render(); return; }
  startSupa(session);
}
function startSupa(session) {
  Supa.uid = session.user.id; S.userEmail = session.user.email;
  const mirror = lsGet(LS.mirror, null), pend = lsGet(LS.pending, []);
  const mine = mirror && mirror.uid === Supa.uid;
  if (mine) { for (const c of COLLS) S[c] = mirror[c] || {}; S.fromMirror = true; }
  backend = Supa; S.mode = 'cloud'; S.ready = !!mine;
  if (mine) for (const key of pend) { const [c, id] = key.split('/'); if (COLLS.includes(c)) persist(c, id, 50); }
  view = { name: 'home', p: {} }; render();
  Supa.subscribe();
}
async function boot() {
  if (window.PGT_SUPA) return bootSupa();
  const mirror = lsGet(LS.mirror, null);
  const pend = lsGet(LS.pending, []);
  const hasClaude = !!(window.claude && typeof window.claude.use === 'function');
  if (hasClaude && mirror) {
    for (const c of COLLS) S[c] = mirror[c] || {};
    S.ready = true; S.fromMirror = true; render();
  }
  let db = null;
  if (hasClaude) {
    try { db = await window.claude.use('db'); } catch { db = null; }
    window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
  }
  if (db) {
    Cloud.db = db; backend = Cloud; S.mode = 'cloud';
    if (mirror) for (const key of pend) { const [c, id] = key.split('/'); if (COLLS.includes(c)) persist(c, id, 50); }
    Cloud.subscribe();
    setTimeout(() => { if (!S.cloudConfirmed) { S.offlineNote = true; S.ready = true; dataChanged(); } }, 10000);
  } else {
    backend = Local; S.mode = 'local'; Local.load(); S.ready = true;
  }
  render();
}

/* ---------- derived data ---------- */
let D = null, Drev = -1;
function derived() {
  if (D && Drev === S.rev) return D;
  const sessions = Object.values(S.sessions).filter(s => s && s.startedAt).sort((a, b) => a.startedAt - b.startedAt);
  const finished = sessions.filter(s => s.status === 'finished');
  const exHist = {};
  for (const s of finished) {
    (s.exercises || []).forEach(e => {
      const done = (e.sets || []).filter(isDone);
      if (!done.length) return;
      const vol = done.reduce((a, x) => a + (num(x.weight) || 0) * x.reps, 0);
      const maxW = Math.max(...done.map(x => num(x.weight) || 0));
      (exHist[e.exerciseId] ||= []).push({ sessionId: s.id, t: s.startedAt, routineId: s.routineId, routineName: s.routineName, color: s.color, sets: done, allSets: e.sets, vol, maxW, reps: done.reduce((a, x) => a + x.reps, 0), plan: { sets: e.planSets, repMin: e.repMin, repMax: e.repMax }, notes: e.notes });
    });
  }
  D = { sessions, finished, exHist, active: sessions.filter(s => s.status === 'active').sort((a, b) => b.startedAt - a.startedAt)[0] || null };
  Drev = S.rev;
  return D;
}
function isDone(x) { return x && x.status === 'done' && Number.isFinite(x.reps) && x.reps > 0; }
function sessionStats(s) {
  let sets = 0, done = 0, vol = 0, exDone = 0;
  (s.exercises || []).forEach(e => {
    let any = false;
    (e.sets || []).forEach(x => { sets++; if (isDone(x)) { done++; any = true; vol += (num(x.weight) || 0) * x.reps; } });
    if (any) exDone++;
  });
  return { sets, done, vol, exDone, exTotal: (s.exercises || []).length, dur: (s.endedAt || now()) - s.startedAt };
}
function lastFor(exId, beforeT = Infinity, excludeSession) {
  const h = derived().exHist[exId] || [];
  for (let i = h.length - 1; i >= 0; i--) if (h[i].t < beforeT && h[i].sessionId !== excludeSession) return h[i];
  return null;
}
function routinesUsing(exId) { return sortedRoutines().filter(r => (r.items || []).some(i => i.exerciseId === exId)); }
function sortedRoutines() { return Object.values(S.routines).sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || a.name.localeCompare(b.name)); }
function exName(id, fallback) { return (S.exercises[id] && S.exercises[id].name) || fallback || id; }
function setsLine(sets) { return sets.map(x => (x.weight == null || x.weight === '' ? '—' : fmtKg(num(x.weight))) + '×' + x.reps).join(' · '); }

/* Conservative progression advice from one real performance.
   Suggests more weight only after every planned set reached the top of the rep range
   and no set was marked hard or technically compromised. */
function advise(entry, plan) {
  if (!entry) return { cls: '', text: 'Sense historial. Tria un pes de prova i registra la primera sessió.' };
  const inc = settings().increment;
  const p = { sets: plan?.sets || entry.plan?.sets || 3, repMin: plan?.repMin ?? entry.plan?.repMin ?? 5, repMax: plan?.repMax ?? entry.plan?.repMax ?? 10 };
  const s = entry.sets, w = entry.maxW;
  const atW = s.filter(x => (num(x.weight) || 0) === w);
  const feels = s.map(x => x.feel);
  if (feels.includes('tech')) return { cls: 'down', text: `Mantén ${fmtKg(w)} kg: hi va haver sèries amb tècnica compromesa.` };
  if (s.length < p.sets) return { cls: '', text: `Mantén ${fmtKg(w)} kg: l’última vegada vas completar ${s.length} de ${p.sets} sèries.` };
  if (s.some(x => x.reps < p.repMin)) return { cls: 'down', text: `Alguna sèrie va quedar per sota de ${p.repMin} reps. Mantén o redueix el pes.` };
  const top = atW.length >= p.sets && atW.every(x => x.reps >= p.repMax);
  if (top && w > 0) {
    if (feels.includes('hard')) return { cls: '', text: `Vas arribar a ${p.repMax} reps però marcant-ho com a difícil. Repeteix ${fmtKg(w)} kg.` };
    if (feels.every(f => f === 'easy' || f === 'normal')) return { cls: 'up', text: `Totes les sèries a ${p.repMax} reps amb bones sensacions. Pots provar ${fmtKg(w + inc)} kg.` };
    return { cls: 'maybe', text: `Vas arribar a ${p.repMax} reps a totes les sèries. Si la tècnica va ser bona, prova ${fmtKg(w + inc)} kg.` };
  }
  return { cls: '', text: `Mantén ${fmtKg(w)} kg i intenta sumar repeticions fins a ${p.repMax} a totes les sèries.` };
}

const app = $('#app');

function go(name, p = {}, { push = true } = {}) {

}
function back(fallback = 'home') { const v = viewStack.pop(); view = v || { name: fallback, p: {} }; render(); window.scrollTo(0, 0); }

function suggestedRoutine() {

}

/* Start a session: plan copied from the routine; weights pre-filled from the last real performance, reps empty */
function startSession(routineId) {
  const r = S.routines[routineId]; if (!r) return;
  const t = now();
  const s = {
    id: uid('s'), routineId: r.id, routineName: r.name, color: r.color, status: 'active', startedAt: t, endedAt: null, notes: '',
    exercises: (r.items || []).map(it => {
      const last = lastFor(it.exerciseId);
      const sets = [];
      for (let i = 0; i < (it.sets || 3); i++) {
        const ref = last ? (last.allSets[i] && isDone(last.allSets[i]) ? last.allSets[i] : last.sets[last.sets.length - 1]) : null;
        sets.push(newSet(i + 1, ref ? num(ref.weight) : null));
      }
      return { exerciseId: it.exerciseId, name: exName(it.exerciseId), planSets: it.sets || 3, repMin: it.repMin ?? 5, repMax: it.repMax ?? 10, rest: it.rest ?? null, notes: '', sets };
    }),
  };
  put('sessions', s.id, s, 0);
  S.rev++;
  requestWakeLock();
  viewStack.length = 0; viewStack.push({ name: 'home', p: {} });
  view = { name: 'workout', p: { id: s.id } }; render(); window.scrollTo(0, 0);
}

}
function curSession() { return view.name === 'workout' ? S.sessions[view.p.id] : null; }
function touchSession(s, delay) { put('sessions', s.id, s, delay); S.rev++; }

/* Finish */
async function finishSession() {
  const s = curSession(); if (!s) return;
  const st = sessionStats(s);
  const pendingSets = st.sets - st.done;
  if (pendingSets > 0) {
    const ok = await confirmBox({ title: 'Hi ha sèries pendents', body: `Tens ${pendingSets} ${pendingSets === 1 ? 'sèrie pendent' : 'sèries pendents'}. Si finalitzes, es guardaran tal com estan i no comptaran com a completades.`, ok: 'Finalitzar igualment', cancel: 'Continuar entrenant' });
    if (!ok) return;
  }
  s.status = 'finished'; s.endedAt = now();
  touchSession(s, 0);
  stopRest(); releaseWakeLock();
  viewStack.length = 0; viewStack.push({ name: 'home', p: {} });
  view = { name: 'summary', p: { id: s.id } }; render(); window.scrollTo(0, 0);
}

/* Summary */
VIEWS.summary = ({ id }) => {
  const s = S.sessions[id]; if (!s) return topbar('Resum') + `<div class="empty"><b>Sessió no trobada</b></div>`;
  const st = sessionStats(s);
  const d = derived();
  const prev = d.finished.filter(x => x.routineId === s.routineId && x.startedAt < s.startedAt).pop();
  let h = topbar('Resum', { backBtn: false, right: `<button class="icon-btn" data-action="tab" data-tab="home">Tancar</button>` });
  h += `<div data-c="${esc(s.color)}"><header class="hero"><span class="kicker rv">${esc(s.routineName)} · ${esc(dFmt(s.startedAt, { weekday: 'long', day: 'numeric', month: 'long' }))} · ${tFmt(s.startedAt)}–${tFmt(s.endedAt)}</span><h1 class="display rv">Fet<span class="dot">.</span></h1></header>`;
  h += `<div class="section tight rv"><div class="figures four">${fig(fmtVol(st.vol), 'kg', 'Volum total')}${fig(st.done + '/' + st.sets, '', 'Sèries completades')}${fig(st.exDone + '/' + st.exTotal, '', 'Exercicis')}${fig(dur(s.endedAt - s.startedAt), '', 'Durada')}</div>`;
  if (prev) {
    const ps = sessionStats(prev), dv = st.vol - ps.vol;
    h += `<p class="lede" style="max-width:48ch">Respecte a l’última sessió de ${esc(s.routineName)} (${esc(dShort(prev.startedAt))}): volum <b class="${dv >= 0 ? 'delta-up' : 'delta-down'}">${dv >= 0 ? '+' : ''}${fmtVol(dv)} kg</b> (${fmtVol(ps.vol)} → ${fmtVol(st.vol)}), sèries ${ps.done} → ${st.done}.</p>`;
  } else h += `<p class="lede" style="max-width:48ch">És la primera sessió de ${esc(s.routineName)} registrada. La propera ja tindrà comparació.</p>`;
  h += `</div>`;
  const improvements = [], recs = [];
  (s.exercises || []).forEach(e => {
    const done = e.sets.filter(isDone); if (!done.length) return;
    const cur = (d.exHist[e.exerciseId] || []).find(x => x.sessionId === s.id);
    const prv = lastFor(e.exerciseId, s.startedAt, s.id);
    const nm = exName(e.exerciseId, e.name);
    if (cur && prv) {
      const parts = [];
      if (cur.maxW > prv.maxW) parts.push(`pes ${fmtKg(prv.maxW)} → ${fmtKg(cur.maxW)} kg`);
      else if (cur.maxW === prv.maxW && cur.reps > prv.reps) parts.push(`+${cur.reps - prv.reps} reps amb ${fmtKg(cur.maxW)} kg`);
      if (cur.vol > prv.vol) parts.push(`volum +${fmtVol(cur.vol - prv.vol)} kg`);
      if (parts.length) improvements.push(`<li><b>${esc(nm)}</b>: ${esc(parts.join(', '))}</li>`);
    }
    if (cur) { const a = advise(cur, { sets: e.planSets, repMin: e.repMin, repMax: e.repMax }); recs.push(`<div class="rec ${a.cls}"><b>${esc(nm)}</b>. ${esc(a.text)}</div>`); }
  });
  h += `<div class="section rv"><header><h2>Millores<span class="dot">.</span></h2></header>${improvements.length ? `<ul style="margin:0;padding-left:18px;display:grid;gap:8px;font-size:17px">${improvements.join('')}</ul>` : `<p class="muted" style="margin:0">${prev || d.finished.length > 1 ? 'Cap millora respecte a l’última vegada que vas fer aquests exercicis.' : 'Encara no hi ha sessions anteriors amb què comparar.'}</p>`}</div>`;
  h += `<div class="section rv"><header><h2>Pròxima sessió<span class="dot">.</span></h2></header>${recs.join('') || '<p class="muted">Sense sèries completades.</p>'}<p class="faint" style="font-size:12px;margin:0">Els suggeriments es basen en les repeticions i en com has marcat cada sèrie. El pes no canvia sol.</p></div>`;
  h += `<div class="section rv"><header><h2>Sèries<span class="dot">.</span></h2></header>${sessionTable(s)}</div>`;
  h += `<div class="wk-foot narrow"><button class="btn primary block" data-action="tab" data-tab="home">Tornar a l’inici</button><button class="btn" data-action="open-session" data-id="${esc(s.id)}">Veure a l’historial</button></div></div>`;
  return h;
};
function sessionTable(s) {
  return (s.exercises || []).map(e => {
    const v = e.sets.filter(isDone).reduce((a, x) => a + (num(x.weight) || 0) * x.reps, 0);
    return `<div class="panel" style="gap:8px"><div class="row"><span class="sub-h grow" style="font-size:18px">${esc(exName(e.exerciseId, e.name))}</span><span class="mono" style="font-weight:600">${fmtVol(v)} <span class="muted" style="font-weight:500;font-size:13px">kg</span></span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Sèrie</th><th class="r">Pes</th><th class="r">Reps</th><th>Estat</th><th>Sensació</th></tr></thead><tbody>
    ${e.sets.map((x, j) => `<tr><td class="mono">${j + 1}</td><td class="r mono">${x.weight == null ? '—' : fmtKg(num(x.weight)) + ' kg'}</td><td class="r mono">${x.reps ?? '—'}</td><td>${isDone(x) ? 'Completada' : '<span class="faint">Pendent</span>'}</td><td>${x.feel ? esc(FEEL_LABEL[x.feel]) : ''}${x.note ? `<div class="muted" style="font-size:12px">${esc(x.note)}</div>` : ''}</td></tr>`).join('')}
    </tbody></table></div>${e.notes ? `<div class="muted" style="font-size:13px">${esc(e.notes)}</div>` : ''}</div>`;
  }).join('') + (s.notes ? `<div class="panel"><span class="eyebrow">Notes</span><div>${esc(s.notes)}</div></div>` : '');
}

/* History */

    <div class="grid2"><label class="f">Des de<input type="date" class="txt" id="hist-from" data-bind="hist-from" value="${esc(f.from)}"></label><label class="f">Fins a<input type="date" class="txt" id="hist-to" data-bind="hist-to" value="${esc(f.to)}"></label></div></div>`;
  h += `<div class="section tight rv"><header><span class="eyebrow">${list.length} ${list.length === 1 ? 'resultat' : 'resultats'}</span>${f.routine !== 'all' || f.from || f.to ? `<button class="link" data-action="hist-clear">Treure filtres</button>` : ''}</header>`;
  if (!d.sessions.length) h += `<div class="empty"><b>Encara no hi ha sessions</b><span>Comença un entrenament des de l’inici; cada sessió finalitzada apareixerà aquí.</span></div>`;

    let month = '';
    h += '<div>' + list.map(s => {

      return head + `<button class="li" data-c="${esc(s.color)}" data-action="open-session" data-id="${esc(s.id)}"><span class="day"><b>${new Date(s.startedAt).getDate()}</b><span>${esc(dFmt(s.startedAt, { weekday: 'short' }))}</span></span>

VIEWS.session = ({ id, cmp }) => {

  return h;
};
function compareTable(a, b) {
  const ids = []; [a, b].forEach(s => (s.exercises || []).forEach(e => { if (!ids.includes(e.exerciseId)) ids.push(e.exerciseId); }));
  const info = (s, id) => { const e = (s.exercises || []).find(x => x.exerciseId === id); if (!e) return null; const dn = e.sets.filter(isDone); return { vol: dn.reduce((t, x) => t + (num(x.weight) || 0) * x.reps, 0), maxW: dn.length ? Math.max(...dn.map(x => num(x.weight) || 0)) : null, line: setsLine(dn) }; };
  const sa = sessionStats(a), sb = sessionStats(b);
  return `<div class="panel" style="gap:6px"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Exercici</th><th>${esc(dShort(a.startedAt))}</th><th>${esc(dShort(b.startedAt))}</th><th class="r">Δ volum</th></tr></thead><tbody>
  ${ids.map(id => { const x = info(a, id), y = info(b, id); const dv = (x?.vol || 0) - (y?.vol || 0);
    return `<tr><td>${esc(exName(id))}</td><td class="mono" style="font-size:12px">${x ? esc(x.line || '—') : '<span class="faint">no fet</span>'}</td><td class="mono" style="font-size:12px">${y ? esc(y.line || '—') : '<span class="faint">no fet</span>'}</td><td class="r mono ${dv > 0 ? 'delta-up' : dv < 0 ? 'delta-down' : ''}">${x && y ? (dv > 0 ? '+' : '') + fmtVol(dv) : '—'}</td></tr>`; }).join('')}
  <tr><td><b>Total</b></td><td class="mono">${fmtVol(sa.vol)} kg</td><td class="mono">${fmtVol(sb.vol)} kg</td><td class="r mono ${sa.vol - sb.vol >= 0 ? 'delta-up' : 'delta-down'}">${sa.vol - sb.vol >= 0 ? '+' : ''}${fmtVol(sa.vol - sb.vol)}</td></tr></tbody></table></div></div>`;
}

/* Stats */
VIEWS.stats = () => {
  const d = derived();
  const f = d.finished, t30 = now() - 30 * 864e5;
  const last30 = f.filter(s => s.startedAt >= t30);
  const allVol = f.reduce((a, s) => a + sessionStats(s).vol, 0);
  let h = pageHead('Estadístiques', 'Progrés', f.length ? `Cada número surt de les sèries que has completat. <b>${f.length} ${f.length === 1 ? 'sessió registrada' : 'sessions registrades'}</b>.` : 'Quan registris sessions, aquí veuràs com evolucionen.');
  h += `<div class="section tight rv"><div class="figures">${fig(f.length, '', 'Sessions')}${fig(last30.length, '', 'Últims 30 dies')}${fig(fmtVol(allVol), 'kg', 'Volum total')}</div></div>`;
  h += `<div class="section rv"><header><h2>Volum per sessió<span class="dot">.</span></h2></header>`;
  if (f.length < 1) h += `<div class="empty"><b>Encara no hi ha dades</b><span>Registra i finalitza sessions per veure l’evolució del volum.</span></div>`;
  else {
    const rs = {}; f.forEach(s => rs[s.routineId] = s);
    h += `<div class="panel">${chartSlot('bar', { rows: f.slice(-40).map(s => ({ t: s.startedAt, v: sessionStats(s).vol, c: s.color, label: s.routineName })) })}<span class="muted" style="font-size:13px">Últimes ${Math.min(40, f.length)} sessions. Toca una barra per veure’n el detall.</span></div>`;
  }
  h += `</div><div class="section rv"><header><h2>Exercicis<span class="dot">.</span></h2><span class="muted" style="font-size:13px">Pes màxim</span></header><div class="list" style="border-top:0">`;
  const exs = Object.values(S.exercises).concat(Object.keys(d.exHist).filter(id => !S.exercises[id]).map(id => ({ id, name: (d.exHist[id][0].allSets && exNameFromHist(id)) || id, deleted: true })));
  const order = []; sortedRoutines().forEach(r => (r.items || []).forEach(i => { if (!order.includes(i.exerciseId)) order.push(i.exerciseId); }));
  exs.sort((a, b) => { const ia = order.indexOf(a.id), ib = order.indexOf(b.id); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.name.localeCompare(b.name); });
  h += exs.map(e => { const hist = d.exHist[e.id] || [], last = hist[hist.length - 1], best = hist.length ? Math.max(...hist.map(x => x.maxW)) : null;
    return `<button class="li" data-action="open-exercise" data-id="${esc(e.id)}"><span class="main"><span class="t" style="display:block">${esc(e.name)}${e.deleted ? ' <span class="tag">eliminat</span>' : ''}</span><span class="s" style="display:block">${hist.length ? `${hist.length} ${hist.length === 1 ? 'sessió' : 'sessions'} · última ${esc(dShort(last.t))}` : 'Sense registres'}</span></span><span class="end">${best != null ? fmtKg(best) + '<small>kg</small>' : '<small>—</small>'}</span><span class="chev">›</span></button>`; }).join('');
  return h + `</div></div>`;
};
function exNameFromHist(id) { for (const s of derived().sessions) for (const e of s.exercises || []) if (e.exerciseId === id && e.name) return e.name; return null; }

VIEWS.exercise = ({ id }) => {
  const d = derived(), hist = d.exHist[id] || [];
  const name = exName(id, exNameFromHist(id));
  let h = topbar('Exercici');
  const rs = routinesUsing(id);
  h += `<header class="hero"><span class="kicker rv">${rs.length ? esc(rs.map(r => r.name).join(' · ')) : 'Fora de les rutines actuals'}</span><h1 class="display md rv">${esc(name)}<span class="dot">.</span></h1></header>`;
  if (!hist.length) return h + `<div class="section tight"><div class="empty"><b>Sense registres</b><span>Completa sèries d’aquest exercici en un entrenament i aquí veuràs el pes, les repeticions i el volum.</span></div></div>`;
  const best = hist.reduce((a, x) => x.vol > a.vol ? x : a, hist[0]);
  const maxW = hist.reduce((a, x) => x.maxW > a.maxW ? x : a, hist[0]);
  const last = hist[hist.length - 1];

  h += `<div class="section tight rv"><div class="figures">${fig(fmtKg(maxW.maxW), 'kg', 'Pes màxim · ' + dShort(maxW.t))}${fig(fmtVol(best.vol), 'kg', 'Millor sessió · ' + dShort(best.t))}${fig(hist.length, '', 'Sessions')}</div></div>
    <div class="section rv"><header><h2>Última sessió<span class="dot">.</span></h2><span class="muted" style="font-size:14px">${esc(dShort(last.t))} · ${esc(last.routineName)}</span></header><div class="ref"><span class="sets" style="font-size:22px">${esc(setsLine(last.sets))}</span><span>${fmtVol(last.vol)} kg de volum</span></div><div class="rec ${a.cls}">${esc(a.text)}</div></div>`;
  const enough = hist.length >= 2;
  const emptyChart = `<div class="empty" style="border-top:0"><b>Cal registrar més sessions</b><span>Amb dues sessions d’aquest exercici ja es dibuixa l’evolució.</span></div>`;
  h += `<div class="section rv"><header><h2>Pes<span class="dot">.</span></h2><span class="muted" style="font-size:14px">Pes màxim per sessió, kg</span></header>${enough ? `<div class="panel">${chartSlot('line', { unit: 'kg', series: [{ name: 'Pes màxim', color: 'var(--accent)', pts: hist.map(x => ({ t: x.t, v: x.maxW })) }] })}</div>` : emptyChart}</div>`;
  const maxSets = Math.min(5, Math.max(...hist.map(x => x.sets.length)));
  const SC = ['var(--accent)', 'var(--fg)', 'var(--muted)', 'var(--faint)', 'var(--line)'];
  const repSeries = []; for (let k = 0; k < maxSets; k++) repSeries.push({ name: 'Sèrie ' + (k + 1), color: SC[k], pts: hist.filter(x => x.sets[k]).map(x => ({ t: x.t, v: x.sets[k].reps, w: num(x.sets[k].weight) })) });
  h += `<div class="section rv"><header><h2>Repeticions<span class="dot">.</span></h2><span class="muted" style="font-size:14px">Per sèrie</span></header>${enough ? `<div class="panel">${chartSlot('line', { unit: 'reps', series: repSeries, int: true })}<div class="legend">${repSeries.map(s => `<span><i style="--lc:${s.color}"></i>${s.name}</span>`).join('')}</div></div>` : emptyChart}</div>`;
  h += `<div class="section rv"><header><h2>Volum<span class="dot">.</span></h2><span class="muted" style="font-size:14px">Pes × reps, kg</span></header>${enough ? `<div class="panel">${chartSlot('line', { unit: 'kg', area: true, series: [{ name: 'Volum', color: 'var(--accent)', pts: hist.map(x => ({ t: x.t, v: x.vol })) }] })}</div>` : emptyChart}</div>`;
  h += `<div class="section rv"><header><h2>Totes les sessions<span class="dot">.</span></h2></header><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Rutina</th><th>Sèries</th><th class="r">Volum</th></tr></thead><tbody>
    ${hist.slice().reverse().map(x => `<tr><td class="mono" style="white-space:nowrap">${esc(dShort(x.t))}</td><td>${esc(x.routineName)}</td><td class="mono" style="font-size:12.5px">${esc(setsLine(x.sets))}</td><td class="r mono">${fmtVol(x.vol)}</td></tr>`).join('')}</tbody></table></div></div>`;
  return h;
};

/* ---------- charts (hand-drawn SVG, real data only) ---------- */
const CH = {}; let chN = 0;
function chartSlot(type, cfg) { const id = 'ch' + (++chN); CH[id] = { type, cfg }; return `<div class="chart" id="${id}" data-chart="${id}"></div>`; }
function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0)), r = step0 / mag;
  const step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(6));
  return t;
}
function drawCharts() {
  $$('[data-chart]').forEach(el => {
    const c = CH[el.dataset.chart]; if (!c) return;
    const W = Math.max(260, el.clientWidth), H = 190;
    if (c.type === 'line') drawLine(el, c.cfg, W, H); else drawBars(el, c.cfg, W, H);
  });
}
function drawLine(el, cfg, W, H) {
  const pad = { l: 44, r: 12, t: 12, b: 26 };
  const all = cfg.series.flatMap(s => s.pts);
  const ts = Array.from(new Set(all.map(p => p.t))).sort((a, b) => a - b);
  const vs = all.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (cfg.area) lo = 0;
  const ticks = niceTicks(lo, hi); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const t0 = ts[0], t1 = ts[ts.length - 1];
  const x = t => t1 === t0 ? (pad.l + W - pad.r) / 2 : pad.l + (t - t0) / (t1 - t0) * (W - pad.l - pad.r);
  const y = v => pad.t + (1 - (v - lo) / (hi - lo)) * (H - pad.t - pad.b);
  let g = ticks.map(v => `<line class="grid-l" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end">${fmtN(v, 1)}</text>`).join('');
  const xl = ts.length > 1 ? [ts[0], ts[ts.length - 1]] : ts;

    if (!s.pts.length) return;

    if (cfg.area) marks += `<path d="${d} L${x(s.pts[s.pts.length - 1].t).toFixed(1)} ${y(lo)} L${x(s.pts[0].t).toFixed(1)} ${y(lo)} Z" fill="${s.color}" opacity=".12"/>`;

function drawBars(el, cfg, W, H) {
  const pad = { l: 48, r: 8, t: 12, b: 26 }, rows = cfg.rows, n = rows.length;
  const ticks = niceTicks(0, Math.max(1, ...rows.map(r => r.v))), hi = ticks[ticks.length - 1];
  const bw = (W - pad.l - pad.r) / n, gap = Math.min(6, bw * .25);
  const y = v => pad.t + (1 - v / hi) * (H - pad.t - pad.b);
  let g = ticks.map(v => `<line class="grid-l" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? fmtN(v / 1000, 1) + 'k' : fmtN(v, 0)}</text>`).join('');
  g += `<text class="ax" x="${pad.l}" y="${H - 6}">${esc(dShort(rows[0].t))}</text><text class="ax" x="${W - pad.r}" y="${H - 6}" text-anchor="end">${esc(dShort(rows[n - 1].t))}</text>`;
  const bars = rows.map((r, i) => { const x0 = pad.l + i * bw + gap / 2, w = Math.max(2, bw - gap), y0 = y(r.v), hh = Math.max(0, y(0) - y0);
    return `<rect x="${x0}" y="${y0}" width="${w}" height="${hh}" rx="${Math.min(4, w / 2)}" fill="${i === n - 1 ? 'var(--accent)' : 'var(--fill-2)'}"/>`; }).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Volum per sessió">${g}${bars}<rect x="${pad.l}" y="0" width="${W - pad.l - pad.r}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  const move = ev => { const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width; const i = Math.max(0, Math.min(n - 1, Math.floor((px - pad.l) / bw))); const row = rows[i];
    tip.innerHTML = `<div class="muted">${esc(dShort(row.t))} · ${esc(row.label)}</div><b>${fmtVol(row.v)} kg</b>`; tip.hidden = false; tip.style.left = Math.min(Math.max((pad.l + (i + .5) * bw) * r.width / W, 70), r.width - 70) + 'px'; };

}

function slug(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'exercici'; }

function toCSV() {
  const head = ['session_id', 'data', 'hora_inici', 'rutina', 'estat_sessio', 'exercise_id', 'exercici', 'serie', 'pes_kg', 'reps', 'estat_serie', 'sensacio', 'observacio_serie', 'completada_a', 'volum_serie_kg', 'notes_exercici'];

async function saveFile(filename, text) {
  if (downloads) {
    try { await downloads.save({ filename, data: text }); toast('Fitxer preparat: ' + filename); return; }
    catch (e) { if (e && e.code === 'declined') return; if (!['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e && e.code)) { toast('No s’ha pogut desar el fitxer (' + (e.code || 'error') + ')'); return; } }
  }
  try {
    const file = new File([text], filename, { type: filename.endsWith('.csv') ? 'text/csv' : 'application/json' });
    if (!window.claude && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: filename.endsWith('.csv') ? 'text/csv' : 'application/json' })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch { toast('Aquesta vista no permet descarregar fitxers.'); }
}
async function importBackup(obj) {
  if (!obj || obj.app !== 'personal-gym-tracker') { toast('Aquest fitxer no és una còpia de Personal Gym Tracker.'); return; }
  const counts = { exercises: 0, routines: 0, sessions: 0 };
  const ok = await confirmBox({ title: 'Restaurar còpia', body: `La còpia té ${(obj.exercises || []).length} exercicis, ${(obj.routines || []).length} rutines i ${(obj.sessions || []).length} sessions. S’afegiran o actualitzaran; no s’esborrarà res.`, ok: 'Restaurar' });
  if (!ok) return;
  for (const c of ['exercises', 'routines', 'sessions', 'config']) for (const doc of obj[c] || []) {
    if (!doc || !doc.id) continue;
    const cur = S[c][doc.id];
    if (cur && (cur.updatedAt || 0) > (doc.updatedAt || 0)) continue;
    const data = clone(doc); if (c === 'config') delete data.id;
    data.updatedAt = data.updatedAt || now();
    S[c][doc.id] = data; persist(c, doc.id, 30 + Math.random() * 400); if (counts[c] != null) counts[c]++;
  }
  S.rev++; render();
  toast(`Restaurat: ${counts.exercises} exercicis, ${counts.routines} rutines, ${counts.sessions} sessions.`);
}

  if (!sec) return;
  rest = { end: now() + sec * 1000, total: sec, label };
  tickRest(); clearInterval(rest.iv); rest.iv = setInterval(tickRest, 250);
}
function stopRest() { if (rest) clearInterval(rest.iv); rest = null; $('#rest').hidden = true; }
function tickRest() {
  const el = $('#rest'); if (!rest) return;
  const left = Math.round((rest.end - now()) / 1000);
  const over = left <= 0;
  if (over && !rest.beeped) { rest.beeped = true; beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {} }
  const a = Math.abs(left), mm = Math.floor(a / 60), ss = String(a % 60).padStart(2, '0');
  el.hidden = false; el.classList.toggle('over', over);
  el.innerHTML = `<div class="bar" style="width:${over ? 100 : (1 - left / rest.total) * 100}%"></div><div class="in"><span class="cl"><span class="clock">${over ? '+' : ''}${mm}:${ss}</span><span class="lbl">${over ? 'Descans acabat' : esc(rest.label || 'Descans')}</span></span><button class="btn sm" data-action="rest-add" data-s="-15">−15</button><button class="btn sm" data-action="rest-add" data-s="15">+15</button><button class="btn sm" data-action="rest-stop">${over ? 'Tancar' : 'Saltar'}</button></div>`;
  if (over && left < -120) stopRest();
}
let actx;
function beep() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.15, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .5); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .5); } catch {} }
let wakeLock = null;
async function requestWakeLock() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { wakeLock = null; } }
function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && view.name === 'workout' && curSession()?.status === 'active') requestWakeLock(); });
setInterval(() => { const e = $('#elapsed'), s = curSession(); if (e && s) e.textContent = dur(now() - s.startedAt); }, 30000);

async function authAction(kind) {
  const email = ($('#login-email').value || '').trim(), pass = $('#login-pass').value || '', msg = $('#login-msg');
  if (!email || pass.length < 6) { msg.textContent = 'Escriu el correu i una contrasenya d’almenys 6 caràcters.'; return; }
  msg.textContent = kind === 'in' ? 'Entrant…' : 'Creant el compte…';
  try {
    const r = kind === 'in' ? await Supa.client.auth.signInWithPassword({ email, password: pass }) : await Supa.client.auth.signUp({ email, password: pass });
    if (r.error) { msg.textContent = /Invalid login/i.test(r.error.message) ? 'El correu o la contrasenya no són correctes.' : /registered/i.test(r.error.message) ? 'Aquest correu ja té compte. Prem Entrar.' : 'No s’ha pogut: ' + r.error.message; return; }
    if (!r.data.session) { msg.textContent = 'Compte creat. Confirma’l des del correu que t’hem enviat i després prem Entrar.'; return; }
    startSupa(r.data.session);
  } catch (e) { msg.textContent = 'Sense connexió. Torna-ho a provar quan tinguis internet.'; }
}

/* ---------- events ---------- */
const A = {
  back: () => back(),
  tab: el => tab(el.dataset.tab),
  go: el => go(el.dataset.view),
  'open-routine': el => go('routine', { id: el.dataset.id }),
  'pick-routine': el => { closeSheet(); go('routine', { id: el.dataset.id }); },
  'start-picker': () => startPicker(),
  'close-sheet': () => closeSheet(),
  'sheet-scrim': (el, ev) => { if (ev.target === el) { if (confirmResolve) resolveConfirm(false); else closeSheet(); } },
  'confirm-yes': () => resolveConfirm(true),
  'confirm-no': () => resolveConfirm(false),
  start: async el => {
    const act = derived().active;
    if (act) {
      const ok = await confirmBox({ title: 'Ja tens un entrenament en curs', body: `${act.routineName}, començat ${ago(act.startedAt)} a les ${tFmt(act.startedAt)}. Continua’l o finalitza’l abans de començar-ne un altre.`, ok: 'Continuar el que està en curs', cancel: 'Tornar' });
      if (ok) { viewStack.length = 0; viewStack.push({ name: 'home', p: {} }); view = { name: 'workout', p: { id: act.id } }; render(); }
      return;
    }
    startSession(el.dataset.id);
  },
  'open-workout': () => { const a = derived().active; if (a) { requestWakeLock(); go('workout', { id: a.id }); } },
  'toggle-ex': el => { const s = curSession() || S.sessions[view.p.id]; const k = s.id + ':' + el.dataset.ex; UI.collapsed[k] = !UI.collapsed[k]; rerenderCard(s, +el.dataset.ex); },
  'toggle-set': el => {
    const s = curSession(); if (!s) return;
    const i = +el.dataset.ex, j = +el.dataset.set, x = s.exercises[i].sets[j];
    if (isDone(x)) { x.status = 'pending'; x.completedAt = null; }
    else {
      const rIn = $(`#r-${i}-${j}`), wIn = $(`#w-${i}-${j}`);
      if (rIn) x.reps = num(rIn.value) != null ? Math.round(num(rIn.value)) : null;
      if (wIn) x.weight = num(wIn.value);
      if (!(x.reps > 0)) { if (rIn) { rIn.classList.remove('err'); void rIn.offsetWidth; rIn.classList.add('err'); rIn.focus(); } toast('Escriu les repeticions per completar la sèrie'); return; }
      x.status = 'done'; x.completedAt = now();
      if (s.status === 'active') startRest(s.exercises[i].rest ?? settings().restDefault, j + 1 < s.exercises[i].sets.length ? 'Següent: sèrie ' + (j + 2) + ' · ' + exName(s.exercises[i].exerciseId, s.exercises[i].name) : (s.exercises[i + 1] ? 'Següent: ' + exName(s.exercises[i + 1].exerciseId, s.exercises[i + 1].name) : 'Últim exercici fet'));
    }
    touchSession(s, 0); rerenderCard(s, i);
  },
  feel: el => { const s = curSession(); if (!s) return; const x = s.exercises[+el.dataset.ex].sets[+el.dataset.set]; x.feel = x.feel === el.dataset.feel ? null : el.dataset.feel; touchSession(s, 0); rerenderCard(s, +el.dataset.ex); },
  'add-set': el => { const s = curSession(); const e = s.exercises[+el.dataset.ex]; const lastW = e.sets.length ? e.sets[e.sets.length - 1].weight : null; e.sets.push(newSet(e.sets.length + 1, lastW)); touchSession(s, 0); rerenderCard(s, +el.dataset.ex); },
  'del-set': async el => { const s = curSession(); const e = s.exercises[+el.dataset.ex]; const x = e.sets[e.sets.length - 1]; if (!x) return;
    if (x.reps != null || x.note) { const ok = await confirmBox({ title: 'Treure la sèrie ' + e.sets.length, body: 'Aquesta sèrie té dades registrades. Si la treus, s’esborraran.', ok: 'Treure-la', danger: true }); if (!ok) return; }
    e.sets.pop(); touchSession(s, 0); rerenderCard(s, +el.dataset.ex); },
  'ex-note': el => { const s = curSession(); const k = s.id + ':' + el.dataset.ex; UI.noteOpen[k] = true; rerenderCard(s, +el.dataset.ex); const t = $(`textarea[data-bind="ex-notes"][data-ex="${el.dataset.ex}"]`); t && t.focus(); },
  'set-note-open': el => { const s = curSession(); UI.setOpen[el.dataset.ex + ':' + el.dataset.set] = true; rerenderCard(s, +el.dataset.ex); const t = $(`input[data-bind="set-note"][data-ex="${el.dataset.ex}"][data-set="${el.dataset.set}"]`); t && t.focus(); },
  finish: () => finishSession(),
  'done-edit': () => { const s = curSession(); viewStack.length = 0; viewStack.push({ name: 'history', p: {} }); view = { name: 'session', p: { id: s.id } }; render(); },
  discard: async () => { const s = curSession(); const st = sessionStats(s);
    const ok = await confirmBox({ title: 'Descartar entrenament', body: st.done ? `S’esborraran les ${st.done} sèries registrades d’aquesta sessió. No es pot desfer.` : 'S’esborrarà aquesta sessió sense sèries registrades.', ok: 'Descartar', danger: true });
    if (!ok) return; remove('sessions', s.id); S.rev++; stopRest(); releaseWakeLock(); tab('home'); },
  'open-session': el => { closeSheet(); go('session', { id: el.dataset.id }); },
  'edit-session': el => go('workout', { id: el.dataset.id }),
  'delete-session': async el => { const s = S.sessions[el.dataset.id]; const ok = await confirmBox({ title: 'Eliminar sessió', body: `S’eliminarà la sessió de ${s.routineName} del ${dShort(s.startedAt)} amb totes les seves sèries. No es pot desfer.`, ok: 'Eliminar', danger: true }); if (!ok) return; remove('sessions', s.id); S.rev++; back('history'); },
  'hist-routine': el => { UI.hist.routine = el.dataset.id; render(true); },
  'hist-clear': () => { UI.hist = { routine: 'all', from: '', to: '' }; render(true); },
  'open-exercise': el => go('exercise', { id: el.dataset.id }),
  'edit-routine': el => go('redit', { id: el.dataset.id }),
  'new-routine': () => { const id = uid('r'); const rs = sortedRoutines(); put('routines', id, { id, name: 'Nova rutina', letter: '', color: 'white', order: rs.length, items: [] }, 0); S.rev++; go('redit', { id }); },
  'routine-move': el => { const rs = sortedRoutines(); const k = rs.findIndex(r => r.id === el.dataset.id), j = k + +el.dataset.dir; if (j < 0 || j >= rs.length) return; [rs[k], rs[j]] = [rs[j], rs[k]]; rs.forEach((r, i) => { if (r.order !== i) { r.order = i; put('routines', r.id, r, 0); } }); S.rev++; render(true); },
  'r-color': el => { const r = S.routines[view.p.id]; r.color = el.dataset.color; put('routines', r.id, r, 0); S.rev++; render(true); },
  'item-move': el => { const r = S.routines[view.p.id]; const k = +el.dataset.k, j = k + +el.dataset.dir; [r.items[k], r.items[j]] = [r.items[j], r.items[k]]; put('routines', r.id, r, 0); S.rev++; render(true); },
  'item-del': async el => { const r = S.routines[view.p.id]; const it = r.items[+el.dataset.k]; const ok = await confirmBox({ title: 'Treure de la rutina', body: `${exName(it.exerciseId)} deixarà de sortir a ${r.name}. L’exercici i el seu historial es mantenen.`, ok: 'Treure' }); if (!ok) return; r.items.splice(+el.dataset.k, 1); put('routines', r.id, r, 0); S.rev++; render(true); },
  'add-item': () => addItemSheet(view.p.id),
  'pick-ex': el => { const r = S.routines[el.dataset.id]; r.items = r.items || []; r.items.push({ exerciseId: el.dataset.ex, sets: 3, repMin: 5, repMax: 10, rest: null }); put('routines', r.id, r, 0); S.rev++; closeSheet(); render(true); },
  'create-ex-add': el => { const q = $('#ex-search').value; const id = createExercise(q); if (!id) return; const r = S.routines[el.dataset.id]; r.items = r.items || []; r.items.push({ exerciseId: id, sets: 3, repMin: 5, repMax: 10, rest: null }); put('routines', r.id, r, 0); S.rev++; closeSheet(); render(true); },
  'delete-routine': async el => { const r = S.routines[el.dataset.id]; const ok = await confirmBox({ title: 'Eliminar rutina', body: `S’eliminarà la rutina ${r.name}. Els exercicis i totes les sessions registrades es mantenen.`, ok: 'Eliminar', danger: true }); if (!ok) return; remove('routines', r.id); S.rev++; tab('manage'); },
  'new-exercise': () => openSheet(`<h2>Nou exercici</h2><input class="txt" id="new-ex-name" placeholder="Nom de l’exercici" autocomplete="off"><div class="row"><button class="btn grow" data-action="close-sheet">Cancel·lar</button><button class="btn primary grow" style="font-size:16px" data-action="create-ex">Crear</button></div>`),
  'create-ex': () => { const n = $('#new-ex-name').value; if (!n.trim()) return; createExercise(n); closeSheet(); render(true); toast('Exercici creat. Afegeix-lo a una rutina des de l’editor.'); },
  'edit-exercise': el => { const e = S.exercises[el.dataset.id]; const n = (derived().exHist[e.id] || []).length;
    openSheet(`<span class="eyebrow">Exercici</span><input class="txt" id="ex-rename" value="${esc(e.name)}" autocomplete="off"><div class="muted" style="font-size:13px">${esc(routinesUsing(e.id).map(r => r.name).join(', ') || 'No és a cap rutina')} · ${n} ${n === 1 ? 'sessió registrada' : 'sessions registrades'}</div>
      <div class="row"><button class="btn grow" data-action="close-sheet">Tancar</button><button class="btn primary grow" style="font-size:16px" data-action="rename-ex" data-id="${esc(e.id)}">Desar nom</button></div><button class="btn danger" data-action="delete-ex" data-id="${esc(e.id)}">Eliminar exercici</button>`); },
  'rename-ex': el => { const e = S.exercises[el.dataset.id]; const n = $('#ex-rename').value.trim(); if (!n) return; e.name = n; put('exercises', e.id, e, 0); S.rev++; closeSheet(); render(true); },
  'delete-ex': async el => { const e = S.exercises[el.dataset.id]; const n = (derived().exHist[e.id] || []).length; const rs = routinesUsing(e.id);
    const ok = await confirmBox({ title: 'Eliminar ' + e.name, danger: true, ok: n ? 'Sí, eliminar-lo' : 'Eliminar',
      body: (n ? `Aquest exercici té ${n} ${n === 1 ? 'sessió registrada' : 'sessions registrades'}. Les sèries ja guardades es mantindran a l’historial amb el seu nom, però l’exercici desapareixerà del catàleg.` : 'Aquest exercici no té dades registrades.') + (rs.length ? ` També es traurà de: ${rs.map(r => r.name).join(', ')}.` : '') });
    if (!ok) return; rs.forEach(r => { r.items = r.items.filter(i => i.exerciseId !== e.id); put('routines', r.id, r, 0); }); remove('exercises', e.id); S.rev++; render(true); toast('Exercici eliminat'); },
  'export-json': () => saveFile(`gym-tracker-copia-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(backupObj(), null, 1)),
  'export-csv': () => saveFile(`gym-tracker-series-${new Date().toISOString().slice(0, 10)}.csv`, toCSV()),
  'rest-add': el => { if (rest) { rest.end += +el.dataset.s * 1000; rest.total = Math.max(1, rest.total + +el.dataset.s); rest.beeped = rest.end <= now(); tickRest(); } },
  'rest-stop': () => stopRest(),
  login: () => authAction('in'),
  signup: () => authAction('up'),
  signout: async () => { const ok = await confirmBox({ title: 'Tancar la sessió', body: pending.size ? `Hi ha ${pending.size} canvis pendents de pujar. Si tanques la sessió ara, es perdran.` : 'Hauràs de tornar a entrar amb el teu correu i contrasenya.', ok: 'Tancar la sessió', danger: true }); if (!ok) return; try { await Supa.client.auth.signOut(); } catch {} try { localStorage.removeItem(LS.mirror); localStorage.removeItem(LS.pending); } catch {} location.reload(); },
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.action]; if (fn) { if (el.tagName === 'A') ev.preventDefault(); try { initAudio(); fn(el, ev); } catch (e) { console.error(e); toast('Error: ' + e.message); } }
});
function initAudio() { try { if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); } if (actx.state === 'suspended') actx.resume(); } catch {} }

const BIND = {
  weight: (el, s) => { const x = s.exercises[+el.dataset.ex].sets[+el.dataset.set]; x.weight = num(el.value); touchSession(s); refreshCounts(s); },
  reps: (el, s, type) => { const x = s.exercises[+el.dataset.ex].sets[+el.dataset.set]; const v = num(el.value); x.reps = v == null ? null : Math.max(0, Math.round(v));
    if (isDone(x) === false && x.status === 'done' && type === 'change') { x.status = 'pending'; x.completedAt = null; touchSession(s, 0); rerenderCard(s, +el.dataset.ex); return; }
    touchSession(s); refreshCounts(s); },
  'set-note': (el, s) => { s.exercises[+el.dataset.ex].sets[+el.dataset.set].note = el.value; touchSession(s, 800); },
  'ex-notes': (el, s) => { s.exercises[+el.dataset.ex].notes = el.value; touchSession(s, 800); },
  'sess-notes': (el, s) => { s.notes = el.value; touchSession(s, 800); },
};
document.addEventListener('input', ev => {
  const el = ev.target, b = el.dataset && el.dataset.bind; if (!b) return;
  if (BIND[b]) { const s = curSession(); if (s) BIND[b](el, s, 'input'); return; }
  if (b === 'ex-search') { const q = el.value; clearTimeout(el._t); el._t = setTimeout(() => addItemSheet(el.dataset.id, q), 120); return; }
  if (b === 'r-name' || b === 'r-letter') { const r = S.routines[view.p.id]; if (b === 'r-name') r.name = el.value || 'Rutina'; else r.letter = el.value.toUpperCase(); put('routines', r.id, r, 700); S.rev++; return; }
  if (b === 'it') { const r = S.routines[view.p.id]; const it = r.items[+el.dataset.k], f = el.dataset.f; const v = num(el.value);
    if (f === 'rest') it.rest = v == null ? null : Math.max(0, Math.round(v));
    else if (v != null) { it[f] = Math.max(f === 'sets' ? 1 : 1, Math.min(f === 'sets' ? 12 : 100, Math.round(v))); }
    if (it.repMin > it.repMax && f !== 'sets' && f !== 'rest') { if (f === 'repMin') it.repMax = it.repMin; else it.repMin = it.repMax; }
    put('routines', r.id, r, 700); S.rev++; return; }
  if (b === 'set-rest' || b === 'set-inc') { const cur = Object.assign({}, settings()); const v = num(el.value); if (v == null || v < 0) return; if (b === 'set-rest') cur.restDefault = Math.round(v); else cur.increment = v; S.config.settings = cur; put('config', 'settings', cur, 700); S.rev++; return; }
});
document.addEventListener('change', ev => {
  const el = ev.target, b = el.dataset && el.dataset.bind;
  if (el.id === 'import-file') { const f = el.files && el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { importBackup(JSON.parse(rd.result)); } catch { toast('El fitxer no és un JSON vàlid.'); } el.value = ''; }; rd.readAsText(f); return; }
  if (!b) return;
  if (b === 'reps') { const s = curSession(); if (s) BIND.reps(el, s, 'change'); return; }
  if (b === 'hist-from' || b === 'hist-to') { UI.hist[b === 'hist-from' ? 'from' : 'to'] = el.value; el.blur(); render(true); return; }
  if (b === 'cmp') { view.p = Object.assign({}, view.p, { cmp: el.value || null }); el.blur(); render(true); return; }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('#sheet').innerHTML) { if (confirmResolve) resolveConfirm(false); else closeSheet(); }
  if (ev.key === 'Enter' && ev.target.matches('.num[data-bind="weight"]')) { ev.preventDefault(); const r = $(`#r-${ev.target.dataset.ex}-${ev.target.dataset.set}`); r && r.focus(); }
  else if (ev.key === 'Enter' && ev.target.matches('.num[data-bind="reps"]')) { ev.preventDefault(); const b = ev.target.closest('.set').querySelector('.chk'); ev.target.blur(); b && b.click(); }
  if (ev.key === 'Enter' && ev.target.id === 'new-ex-name') A['create-ex']();
  if (ev.key === 'Enter' && (ev.target.id === 'login-pass' || ev.target.id === 'login-email')) { ev.preventDefault(); authAction('in'); }
});
window.addEventListener('pagehide', () => { for (const [key, p] of pending) if (p.timer) { clearTimeout(p.timer); const [c, id] = key.split('/'); flush(c, id); } writeMirror(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { for (const [key, p] of pending) if (p.timer) { clearTimeout(p.timer); const [c, id] = key.split('/'); flush(c, id); } writeMirror(); } });

boot();
</script>
